name: Weekly ranked sweep

# The ranked week, in UTC:
#
#   Mon 05:00   counters and trophies zero; signup and placement open
#   Mon 17:00   battles begin (Tue 01:00 AWST) — nothing happens before this
#   Mon 05:00   battles end and everything zeroes again
#
# So play runs right up to the reset, and a capture is only a record of the
# week if it lands before it. Learned the hard way: runs at 05:30 and 09:30
# captured 9,752 of 9,753 players on zero attacks — not a partly-elapsed week
# but one that had not started.
#
# Two attempts, both pre-reset. 04:00 is insurance; 04:35 is the one that
# counts, landing as close to the end of play as a fifteen-minute sweep safely
# can. Every minute earlier is attacks missed, every minute later risks
# crossing the boundary — and the sweep aborts rather than write a capture
# that read some players before the reset and some after, so a late 04:35 run
# fails harmlessly and 04:00's snapshot stands.
on:
  schedule:
    - cron: '0 4 * * 1'
    - cron: '35 4 * * 1'
  workflow_dispatch:
    inputs:
      discover:
        description: 'Rebuild the clan list first (slow; monthly is plenty)'
        type: boolean
        default: false
      max_clans:
        description: 'How many clans to read'
        required: false
        default: '20000'
      no_enrich:
        description: 'Skip per-player attack/defence wins'
        type: boolean
        default: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Scoped to this job, not the workflow. Workflow-level concurrency would
    # make the 04:15 run queue behind the 03:20 run's discovery job, which can
    # take hours — pushing the capture that matters past the reset it exists to
    # beat. Discovery gets its own group below.
    concurrency:
      group: sweep
      cancel-in-progress: false
    # Reading 20k clans is ~11 minutes; enriching ~10k players adds ~10 more.
    # Discovery, when enabled, is the long pole.
    timeout-minutes: 180
    env:
      COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
      COC_API_BASE: ${{ vars.COC_API_BASE || 'https://cocproxy.royaleapi.dev/v1' }}
      COC_CONCURRENCY: ${{ vars.COC_CONCURRENCY || '10' }}
      TRACKED_LEAGUE_IDS: ${{ vars.TRACKED_LEAGUE_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sweep clans and capture the week
        run: |
          npm run sweep -- \
            ${{ inputs.discover && '--discover' || '' }} \
            --max-clans ${{ inputs.max_clans || '20000' }} \
            ${{ inputs.no_enrich && '--no-enrich' || '' }}

  # Clan membership churns slowly, so rediscovery is monthly rather than weekly.
  # It is the expensive phase and the weekly run reuses whatever it stored.
  discover:
    if: github.event_name == 'schedule' && github.event.schedule == '35 4 * * 1'
    runs-on: ubuntu-latest
    concurrency:
      group: discover
      cancel-in-progress: false
    timeout-minutes: 300
    needs: sweep
    env:
      COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
      COC_API_BASE: ${{ vars.COC_API_BASE || 'https://cocproxy.royaleapi.dev/v1' }}
      TRACKED_LEAGUE_IDS: ${{ vars.TRACKED_LEAGUE_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only on the first Monday of the month.
      - name: Refresh the clan list
        run: |
          if [ "$(date -u +%d)" -le 07 ]; then
            npm run sweep -- --discover --max-clans 1
          else
            echo "not the first Monday; skipping clan rediscovery"
          fi
