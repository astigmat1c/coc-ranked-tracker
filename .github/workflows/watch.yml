name: Watch ranked battles

# Reads a small watchlist often enough to see individual battles.
#
# Every ranked battle splits 40 trophies between attacker and defender, so a
# poll window containing exactly ONE event carries that event's star count in
# its trophy movement. Windows holding two events cannot be split, which makes
# cadence the whole design question — and attacks are bursty, so collisions are
# worse than an even spread suggests. Simulated over 200 weeks:
#
#   every 60 min   44% of events resolved
#   every 30 min   57%
#   every 15 min   70%
#   every  2 min   effectively all of them
#
# GitHub's own schedule cannot fire faster than every five minutes and is
# routinely late, so the run does the pacing itself: fire hourly, then poll from
# inside the job every two minutes for fifty-eight of them. Thirty calls an hour
# for one player, and no dependence on scheduler punctuality.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Player tags to watch, comma separated (overrides WATCH_TAGS)'
        required: false
      every:
        description: 'Seconds between polls'
        required: false
        default: '120'

concurrency:
  # Never two pollers at once: they would write different captured_at values for
  # the same interval and turn one clean window into two half-windows.
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
      COC_API_BASE: ${{ vars.COC_API_BASE || 'https://cocproxy.royaleapi.dev/v1' }}
      COC_CONCURRENCY: ${{ vars.COC_CONCURRENCY || '10' }}
      WATCH_TAGS: ${{ inputs.tags || vars.WATCH_TAGS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 58 minutes, so a late start still finishes before the next hour fires.
      - name: Poll the watchlist
        run: npm run watch -- --loop 58 --every ${{ inputs.every || '120' }}
